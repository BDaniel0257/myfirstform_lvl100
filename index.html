<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Form</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    
    
     <form>
        
     <h1>FORM</h1>
    <label for="Firstname">FIRSTNAME</label>
    <input type="text" name="Firstname" id="fname" placeholder="Enter your Firstname" required> 

    <label for="Lastname">LASTNAME</label>
    <input type="text" name="Lastname" id="fname" placeholder="Enter your Lastname" required>

    <label for="email">EMAIL:</label><br>
    <input type="email" name="email" id="email" placeholder="Enter your email" required> <br><br>

    <label for="Password">PASSWORD</label><br>
    <input type="password" name="password" id="pword" placeholder="Enter your Password" required><br><br>

    <label for="date">DATE</label><br>
    <input type="date" name="date" id="date" required>

    <label for="color">COLOR</label>
    <input class="dd" type="color" name="color" id="color"  required>

    <label for="date-time">DATE-TIME</label><br>
    <input type="datetime-local" name="date-time" id="dt" required> <br><br>

    <h2>GENDER</h2>
    <input type="radio" name="gender" id="male" required>
    <label for="male">MALE</label>

    <input type="radio" name="gender" id="male" required>
    <label for="male">FEMALE</label>

    


  <button type="submit">SUBMIT</button>
  </form>
</body>
</html>
